<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Listening Repeater</title>
<style>
:root,[data-theme="light"]{--bg:#fff;--card:#fff;--text:#2d2d2d;--sub:#888;--border:#e5e5e5;--accent:#10a37f;--hover:#f7f7f8;--active:#e8f5f1;--codebg:#f0f0f0;--videobg:#000}
[data-theme="dark"]{--bg:#212121;--card:#2d2d2d;--text:#ececec;--sub:#9e9e9e;--border:#404040;--accent:#19c37d;--hover:#353535;--active:#1a3a2a;--codebg:#1a1a1a;--videobg:#000}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow:hidden;height:100vh}
.app{display:flex;height:100vh}
.sidebar{width:240px;min-width:240px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar h3{padding:16px 16px 8px;font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.sidebar .svid{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--sub);border-left:2px solid transparent;word-break:break-word;line-height:1.4;transition:.12s}
.sidebar .svid:hover{background:var(--hover);color:var(--text)}
.sidebar .svid.active{background:var(--active);color:var(--accent);border-left-color:var(--accent);font-weight:500}
.sidebar .theme-btn{margin:auto 16px 16px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;background:var(--card);color:var(--sub)}
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:16px 20px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--sub)}
.empty .icon{font-size:48px;opacity:.2;margin-bottom:12px}
.empty h3{font-size:18px;font-weight:500;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px}
.player{flex:1;display:flex;flex-direction:column;gap:12px}
.video-wrap{background:var(--videobg);border-radius:12px;overflow:hidden;flex-shrink:0;width:100%}
video{width:100%;display:block;max-height:62vh}
.subtitle-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.subtitle-card .stamp{font-size:11px;color:var(--sub);margin-bottom:6px}
.subtitle-card .tx{font-size:20px;line-height:1.6}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;background:var(--card);color:var(--text);transition:.12s;font-family:inherit}
.btn:hover{background:var(--hover)}.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.opts{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
.opts input[type=number],.opts select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:12px;width:54px}
.opts select{width:auto}
.info-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.seglist{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:8px;min-height:0}
.segrow{display:flex;align-items:center;padding:6px 12px;cursor:pointer;font-size:12px;gap:8px;border-bottom:1px solid var(--border);transition:.1s}
.segrow:last-child{border-bottom:none}.segrow:hover{background:var(--hover)}
.segrow.on{background:var(--active);border-left:2px solid var(--accent)}
.segrow .n{color:var(--sub);min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.segrow .t{color:var(--sub);min-width:82px;font-size:11px;font-variant-numeric:tabular-nums}
.segrow .x{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resize-handle{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .2s}.resize-handle:hover{background:var(--accent)}
.right-panel{width:300px;min-width:200px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
.right-panel h3{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.right-panel input,.right-panel textarea{padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:11px;font-family:inherit;width:100%;margin-bottom:6px}
.right-panel textarea{resize:none;min-height:44px}
.qa-area{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;line-height:1.5;margin:6px 0;min-height:0}
.qa-area .q{color:var(--accent);font-size:11px;margin-bottom:4px}
.qa-area .a{color:var(--text);padding:8px 10px;background:var(--bg);border-radius:6px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.hidden{display:none !important}
.thinking{display:flex;gap:4px;align-items:center;padding:8px 10px}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.4s infinite ease-in-out}
.thinking span:nth-child(1){animation-delay:0s}.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
    <h3>Videos</h3>
    <div id="sidebar-list" style="flex:1"></div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
</div>
<div class="main" id="main">
    <div class="empty" id="empty">
        <div class="icon">🎧</div>
        <h3>Select a video</h3>
        <p>Choose from the sidebar to start practicing</p>
    </div>
    <div class="player hidden" id="player">
        <div class="video-wrap"><video id="video" controls preload="metadata"></video></div>
        <div class="subtitle-card"><div class="stamp" id="stamp">00:00 - 00:00</div><div class="tx" id="text">Click a sentence</div></div>
        <div class="ctrls">
            <button class="btn" id="prev">← Prev</button><button class="btn go" id="play">▶ Play</button><button class="btn" id="next">Next →</button><button class="btn" id="repeat">🔁 Repeat</button>
        </div>
        <div class="opts">
            <label>Repeat <input type="number" id="rc" value="5" min="1" max="50"></label>
            <label>Speed <select id="sp"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select></label>
            <label><input type="checkbox" id="auto"> Auto-next</label>
            <span>Jump</span><input type="number" id="jump" value="1" min="1" style="width:48px"><button class="btn" id="jumpbtn" style="padding:4px 10px;font-size:11px">Go</button>
        </div>
        <div class="info-row"><span id="counter">0 / 0</span><span id="rcounter">Repeat 0/5</span></div>
        <div class="seglist" id="seglist"></div>
    </div>
</div>
<div class="resize-handle" id="resize-handle"></div><div class="right-panel" id="right-panel">
    <h3>🤖 AI Tutor</h3>
    <input type="text" id="api-url" value="http://100.99.214.73:8001/v1" placeholder="API URL">
    <input type="password" id="api-key" placeholder="API Key (optional)">
    <input type="text" id="sys-prompt" value="你是英语视频学习老师，帮助用户理解英语句子、单词和语法规则。用中文简短回答。" placeholder="System prompt">
    <div class="qa-area" id="qa-area"><span style="color:var(--sub);font-size:12px">Click a sentence, then Explain</span></div>
    <div style="display:flex;gap:4px;margin-bottom:6px">
        <button class="btn go" id="qa-explain" style="flex:1;font-size:11px;padding:5px">📖 Explain</button>
        <button class="btn go" id="qa-words" style="flex:1;font-size:11px;padding:5px">📝 Words</button>
        <button class="btn go" id="qa-grammar" style="flex:1;font-size:11px;padding:5px">📐 Grammar</button>
    </div>
    <div style="display:flex;gap:4px"><input type="text" id="qa-input" placeholder="Ask..." style="flex:1"><button class="btn go" id="qa-ask" style="font-size:11px;padding:5px 12px">Send</button></div>
</div>
</div>
<script>
function toggleTheme(){var h=document.documentElement;var l=h.getAttribute("data-theme")==="light";h.setAttribute("data-theme",l?"dark":"light");localStorage.setItem("theme",l?"dark":"light");document.getElementById("theme-btn").textContent=l?"☀ Light":"🌙 Dark"}
(function(){var s=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",s);document.getElementById("theme-btn").textContent=s==="dark"?"☀ Light":"🌙 Dark"})();
</script>
<script src="/static/js/app.js?v=61"></script>
<script>(function(){var h=document.getElementById("resize-handle");var p=document.getElementById("right-panel");if(!h||!p)return;var r=false,sx=0,sw=0;h.onmousedown=function(e){r=true;sx=e.clientX;sw=p.offsetWidth;e.preventDefault()};document.onmousemove=function(e){if(!r)return;var w=Math.max(200,Math.min(600,sw-(e.clientX-sx)));p.style.width=w+"px";p.style.minWidth=w+"px"};document.onmouseup=function(){r=false}})();</script></body>
</html>
